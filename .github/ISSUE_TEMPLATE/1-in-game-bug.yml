name: In-game bug
description: Something goes wrong while playing (graphics, gameplay, sound, controls, crash during play).
labels: ["bug", "in-game"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Your **save file** plus a short description of where the problem happens lets us reproduce it much faster, so please add one if you can.

        **Please don't share save states** (`slotN.bin`): they contain the game's own code and data from your console, which must not be shared publicly.

        If a maintainer closed your issue and the problem comes back, comment `/reopen` on it (as the person who opened it) and it reopens automatically.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected instead. Screenshots or a short video help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Where in the game, and what you did right before it happened.
      placeholder: |
        1. Go to ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: savefile
    attributes:
      label: Save file, or why you can't add one
      description: |
        **Please attach your save file** (it only holds your progress, about 9 KB):
        1. If you can, save in the game (or reload your last save) close to where the problem happens.
        2. Find `cking.sav`:
           - Release (all systems): `data/save/user/cking.sav` inside the folder you unzipped
           - Built from source: `save/user/cking.sav` in the folder you start the game from (or the folder you pass with `--save`)
        3. Zip it and drag the zip into this box.

        Then describe where you were and what you did (island or dungeon, room, which file slot), so we can get there from your save.

        **Don't attach or link save states** (`slotN.bin`): they contain the game's code and data and must not be shared.
        If you can't add a save file, write the reason here instead.
      placeholder: "cking.zip attached, file 1, standing at ... or: no save because ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (e.g. v0.2.1), or the commit if you built it yourself (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux (x86-64)
        - Linux (arm64)
        - Android
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: CPU, GPU and RAM (e.g. "Ryzen 5 5600, RTX 3060, 16 GB" or "M1, 8 GB").
    validations:
      required: true
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options:
        - Metal
        - Vulkan
        - Don't know
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If the game crashed: the newest `crash-<date>-<time>.log` from `data/captures/` (release) or `captures/` (built from source). If the setup failed: `data/setup.log`. Drag the file in here.
